          format: time
          nullable: true
        salon:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        vendor:
          type: string
          format: uuid
          readOnly: true
          nullable: true
      required:
      - date
      - id
      - salon
      - vendor
    Availaibility:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        day_of_week:
          allOf:
          - $ref: '#/components/schemas/DayOfWeekEnum'
          minimum: -2147483648
          maximum: 2147483647
        start_time:
          type: string
          format: time
        end_time:
          type: string
          format: time
        salon:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        vendor:
          type: string
          format: uuid
          readOnly: true
          nullable: true
      required:
      - end_time
      - id
      - salon
      - start_time
      - vendor
    Booking:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        customer:
          type: string
          format: uuid
        salon_service:
          type: string
          format: uuid
          nullable: true
        vendor_service:
          type: string
          format: uuid
          nullable: true
        date:
          type: string
          format: date
