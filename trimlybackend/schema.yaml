          maxLength: 150
        last_name:
          type: string
          maxLength: 150
      required:
      - email
      - pk
    Vendor:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        worker:
          type: string
          format: uuid
          readOnly: true
        category:
          allOf:
          - $ref: '#/components/schemas/Category'
          readOnly: true
        bio:
          type: string
        profile_pic:
          type: string
          nullable: true
          title: Image
        years_of_experience:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        Gender:
          $ref: '#/components/schemas/GenderEnum'
        is_active:
          type: boolean
        vendor_services:
          type: array
          items:
            $ref: '#/components/schemas/VendorServices'
          readOnly: true
        vendor_portfolio:
          type: array
          items:
            $ref: '#/components/schemas/Gallery'
          readOnly: true
        vendor_reviews:
          type: array
          items:
            $ref: '#/components/schemas/Review'
          readOnly: true
      required:
      - bio
      - category
      - id
      - vendor_portfolio
      - vendor_reviews
      - vendor_services
      - worker
      - years_of_experience
    VendorServices:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        description:
          type: string
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        duration_minutes:
          type: integer
          maximum: 2147483647
          minimum: 0
        vendor:
          type: string
          format: uuid
          readOnly: true
        categories:
          type: array
          items:
            type: integer
      required:
      - categories
      - id
      - name
      - vendor
    VerifyEmail:
      type: object
      properties:
        key:
          type: string
          writeOnly: true
      required:
      - key
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
