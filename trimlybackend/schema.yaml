components:
  schemas:
    AvailabilityException:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        date:
          type: string
          format: date
        is_available:
          type: boolean
        start_time:
          type: string
          format: time
          nullable: true
        end_time:
          type: string
          format: time
          nullable: true
        salon:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        vendor:
          type: string
          format: uuid
          readOnly: true
          nullable: true
      required:
      - date
      - id
      - salon
      - vendor
    Availaibility:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        day_of_week:
          allOf:
          - $ref: '#/components/schemas/DayOfWeekEnum'
          minimum: -2147483648
          maximum: 2147483647
        start_time:
          type: string
          format: time
        end_time:
          type: string
          format: time
        salon:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        vendor:
          type: string
          format: uuid
          readOnly: true
          nullable: true
      required:
      - end_time
      - id
      - salon
      - start_time
      - vendor
    Booking:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        customer:
          type: string
          format: uuid
        salon_service:
          type: string
          format: uuid
          nullable: true
        vendor_service:
          type: string
          format: uuid
          nullable: true
        date:
          type: string
          format: date
        start_time:
          type: string
          format: time
        end_time:
          type: string
          format: time
          readOnly: true
        status:
          $ref: '#/components/schemas/StatusEnum'
      required:
      - customer
      - date
      - end_time
      - id
      - start_time
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
    CustomRegister:
      type: object
      properties:
        email:
          type: string
          format: email
        password1:
          type: string
          writeOnly: true
        password2:
          type: string
          writeOnly: true
        role:
          $ref: '#/components/schemas/RoleEnum'
        phone_number:
          type: string
      required:
      - email
      - password1
      - password2
      - role
    DayOfWeekEnum:
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      type: integer
      description: |-
        * `0` - Monday
        * `1` - Tuesday
        * `2` - Wednesday
        * `3` - Thursday
        * `4` - Friday
        * `5` - Saturday
        * `6` - Sunday
    EmailLogin:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
      - email
      - password
    Gallery:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        salon:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        vendor:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        caption:
          type: string
          maxLength: 255
        image:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - image
      - salon
      - vendor
    GenderEnum:
