          allOf:
          - $ref: '#/components/schemas/Category'
          readOnly: true
        bio:
          type: string
        profile_pic:
          type: string
          nullable: true
          title: Image
        years_of_experience:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        Gender:
          $ref: '#/components/schemas/GenderEnum'
        is_active:
