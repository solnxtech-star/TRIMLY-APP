  /api/v1/bookings/:
    get:
      operationId: bookings_list
      description: |-
        Production Engine handling Bookings for Admins, Salon Owners, Independent Vendors, and Clients.
        Manages state machine transitions, automated escrow/wallet entries, and real-time Celery task synchronization.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - bookings
      security:
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookingList'
          description: ''
    post:
      operationId: bookings_create
      description: |-
        Production Engine handling Bookings for Admins, Salon Owners, Independent Vendors, and Clients.
        Manages state machine transitions, automated escrow/wallet entries, and real-time Celery task synchronization.
      tags:
