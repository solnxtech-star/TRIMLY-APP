      - jwtAuth: []
      - {}
      responses:
        '200':
          description: Email verified successfully
        '400':
          description: Invalid OTP or validation error
  /api/v1/auth/registration/resend-email/:
    post:
      operationId: auth_registration_resend_email_create
      description: |-
