components:
  schemas:
    AvailabilityException:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        date:
          type: string
          format: date
        is_available:
          type: boolean
        start_time:
          type: string
          format: time
          nullable: true
        end_time:
          type: string
          format: time
          nullable: true
        salon:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        vendor:
          type: string
          format: uuid
          readOnly: true
          nullable: true
      required:
      - date
      - id
      - salon
      - vendor
    Booking:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        customer_id:
          type: string
          format: uuid
          readOnly: true
        customer_name:
          type: string
          readOnly: true
        customer_address:
          type: string
          nullable: true
          readOnly: true
        vendor_id:
          type: string
          format: uuid
          readOnly: true
        salon_id:
          type: string
          format: uuid
          readOnly: true
        customer_image:
          type: string
          readOnly: true
        salon_service:
          type: string
          format: uuid
          nullable: true
        vendor_service:
          type: string
          format: uuid
          nullable: true
        amount:
          type: string
          readOnly: true
        duration:
          type: string
          readOnly: true
        provider_name:
          type: string
          readOnly: true
        provider_image:
          type: string
          readOnly: true
        provider_location:
          type: string
          readOnly: true
        vendor_service_name:
          type: string
          readOnly: true
        date:
          type: string
          format: date
        start_time:
          type: string
          format: time
        end_time:
          type: string
          format: time
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/BookingStatusEnum'
          readOnly: true
        payment_reference:
          type: string
          nullable: true
          maxLength: 20
        is_rated:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - created_at
      - customer_address
      - customer_id
      - customer_image
      - customer_name
      - date
      - duration
      - end_time
      - id
      - is_rated
      - provider_image
      - provider_location
      - provider_name
      - salon_id
      - start_time
      - status
      - vendor_id
      - vendor_service_name
    BookingReschedule:
      type: object
      properties:
        date:
          type: string
          format: date
        start_time:
          type: string
        end_time:
          type: string
      required:
      - date
      - end_time
      - start_time
    BookingStatusEnum:
      enum:
      - pending
      - confirmed
      - completed
      - cancelled
      type: string
      description: |-
        * `pending` - Pending
        * `confirmed` - Confirmed
        * `completed` - Completed
        * `cancelled` - Cancelled
    BulkAvailability:
      type: object
      description: |-
        Accepts an array of schedules, replaces any existing schedule configuration
        for the provider, and saves them efficiently in a single atomic bulk operation.
      properties:
        schedules:
          type: array
          items:
            $ref: '#/components/schemas/IndividualAvailabilityDay'
      required:
      - schedules
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        category_image:
          type: string
          nullable: true
          title: Image
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
    ConversationList:
      type: object
      properties:
        id:
          type: string
          format: uuid
        other_user:
          type: string
          readOnly: true
        last_message:
          type: string
          readOnly: true
        last_message_at:
          type: string
          format: date-time
          readOnly: true
        is_last_message_unread:
          type: string
          readOnly: true
      required:
      - is_last_message_unread
      - last_message
      - last_message_at
      - other_user
    CustomRegister:
      type: object
      properties:
        email:
          type: string
          format: email
        password1:
          type: string
          writeOnly: true
        password2:
          type: string
          writeOnly: true
        role:
          $ref: '#/components/schemas/RoleEnum'
        phone_number:
          type: string
      required:
      - email
      - password1
      - password2
      - role
    CustomerProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        profile_pic:
          type: string
          format: uri
          nullable: true
        phone_number:
          type: string
          nullable: true
          maxLength: 15
        customer_address:
          type: string
          nullable: true
          maxLength: 200
      required:
      - id
    DayOfWeekEnum:
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      type: integer
      description: |-
        * `0` - Monday
        * `1` - Tuesday
        * `2` - Wednesday
        * `3` - Thursday
        * `4` - Friday
        * `5` - Saturday
        * `6` - Sunday
    EmailLogin:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
      - email
      - password
    GalleryImage:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        image:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - image
    GalleryPost:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        salon:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        vendor:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        caption:
          type: string
          nullable: true
          maxLength: 255
        images:
          type: array
          items:
            $ref: '#/components/schemas/GalleryImage'
          readOnly: true
        uploaded_images:
          type: array
          items:
            type: string
            format: uri
          writeOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - images
      - salon
      - uploaded_images
      - vendor
    GenderEnum:
      enum:
      - male
      - female
      type: string
      description: |-
        * `male` - male
        * `female` - female
    IndividualAvailabilityDay:
      type: object
      description: Handles validation for an individual day object inside the bulk
        payload.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        day_of_week:
          allOf:
          - $ref: '#/components/schemas/DayOfWeekEnum'
          minimum: -2147483648
          maximum: 2147483647
        start_time:
          type: string
          format: time
        end_time:
          type: string
          format: time
      required:
      - end_time
      - id
      - start_time
    IndividualVendor:
      type: object
      properties:
        id:
          type: string
          format: uuid
        profile_pic:
          type: string
          format: uri
          nullable: true
        date_of_birth:
          type: string
          format: date-time
          readOnly: true
        bio:
          type: string
          nullable: true
        phone_number:
          type: string
          nullable: true
          maxLength: 20
        years_of_experience:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        Gender:
          $ref: '#/components/schemas/GenderEnum'
        location:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
          maxLength: 255
        bank_code:
          type: string
          nullable: true
          maxLength: 15
        account_number:
          type: string
          nullable: true
          maxLength: 15
        account_name:
          type: string
          nullable: true
          maxLength: 100
        bank_name:
          type: string
          nullable: true
          maxLength: 100
        total_earnings:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
