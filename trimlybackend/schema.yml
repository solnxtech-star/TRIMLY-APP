        is_active:
          type: boolean
        is_available:
          type: boolean
        is_nin_verified:
          type: boolean
        nin_verified_at:
          type: string
          format: date-time
          nullable: true
        tags:
          type: string
          nullable: true
          maxLength: 20
        category:
          type: integer
          nullable: true
      required:
      - date_of_birth
    JWT:
